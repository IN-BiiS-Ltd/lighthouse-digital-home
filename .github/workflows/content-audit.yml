name: Content & SEO duplication audit

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # كل يوم الساعة 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit duplicate titles, meta descriptions, body blocks and related links
        run: node scripts/audit-content.mjs

      - name: Audit related links (self-links, loops, orphans) + supervisor report
        run: node scripts/audit-related-links.mjs

      - name: Enforce official logo usage (reject modified or unofficial logos)
        run: node scripts/audit-logo.mjs

      - name: Audit 301 redirects + links pointing at redirect hops
        run: node scripts/audit-redirects.mjs

      - name: Upload redirect board report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redirects-report
          path: reports/redirects-report.md

      - name: Upload supervisor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: related-links-report
          path: reports/related-links-report.md

      - name: Install dependencies
        run: npm ci

      - name: Start preview server
        run: |
          npm run build
          npx vite preview --port 8080 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done

      - name: Audit Schema.org / JobPosting JSON-LD and Open Graph previews
        run: node scripts/audit-structured-data.mjs http://localhost:8080
