<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      :root {
        --navy: #1c2360;
        --navy-deep: #141a4a;
        --gold: #c08a2e;
        --ink: #1a1d2b;
        --muted: #4a4f63;
        --line: #d8dae4;
        --sand: #f7f5ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Manrope", sans-serif;
        color: var(--ink);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body[dir="rtl"] {
        font-family: "IBM Plex Sans Arabic", sans-serif;
      }
      .page {
        position: relative;
        width: 210mm;
        height: 297mm;
        padding: 16mm 18mm 14mm;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8mm;
        border-bottom: 0.4mm solid var(--line);
        padding-bottom: 5mm;
      }
      .top img {
        height: 15mm;
      }
      .top span {
        font-size: 8.5pt;
        color: var(--navy);
      }
      .eyebrow {
        margin: 9mm 0 0;
        font-size: 8pt;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 700;
      }
      body[dir="rtl"] .eyebrow {
        letter-spacing: 0;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-weight: 500;
        font-size: 21pt;
        line-height: 1.25;
        margin: 3mm 0 0;
        color: var(--navy-deep);
      }
      body[dir="rtl"] h1 {
        font-family: "IBM Plex Sans Arabic", sans-serif;
        font-weight: 600;
      }
      .rule {
        margin-top: 4mm;
        height: 0.6mm;
        width: 60mm;
        background: linear-gradient(90deg, var(--gold), rgba(192, 138, 46, 0));
      }
      body[dir="rtl"] .rule {
        background: linear-gradient(270deg, var(--gold), rgba(192, 138, 46, 0));
      }
      .lede {
        margin: 5mm 0 0;
        font-size: 10pt;
        line-height: 1.7;
        color: var(--muted);
      }
      .lede strong {
        color: var(--navy-deep);
        font-weight: 700;
      }
      .bar {
        margin-top: 7mm;
        border-radius: 3mm;
        background: var(--navy-deep);
        color: #f6f2e6;
        padding: 6mm 7mm;
      }
      .bar h2 {
        font-family: "Fraunces", serif;
        font-weight: 500;
        font-size: 12.5pt;
        margin: 0;
        color: #e9c37c;
      }
      body[dir="rtl"] .bar h2 {
        font-family: "IBM Plex Sans Arabic", sans-serif;
        font-weight: 600;
      }
      .chips {
        margin: 5mm 0 0;
        display: flex;
        gap: 3mm;
      }
      .chip {
        flex: 1;
        border: 0.4mm solid rgba(233, 195, 124, 0.5);
        border-radius: 2.5mm;
        padding: 4mm 2mm;
        text-align: center;
        font-size: 8.5pt;
        line-height: 1.35;
        color: #e9c37c;
      }
      .bar p {
        margin: 5mm 0 0;
        font-size: 9pt;
        line-height: 1.65;
      }
      .cols {
        margin-top: 7mm;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8mm;
      }
      .cols h3 {
        font-family: "Fraunces", serif;
        font-weight: 500;
        font-size: 11.5pt;
        margin: 0;
        color: var(--navy);
      }
      body[dir="rtl"] .cols h3 {
        font-family: "IBM Plex Sans Arabic", sans-serif;
        font-weight: 600;
      }
      .cols p {
        margin: 2.5mm 0 0;
        font-size: 9pt;
        color: var(--muted);
      }
      ul {
        margin: 3mm 0 0;
        padding-inline-start: 5.5mm;
      }
      li {
        font-size: 9pt;
        line-height: 1.55;
        color: var(--muted);
        margin-bottom: 1.2mm;
      }
      li::marker {
        color: var(--gold);
      }
      figure {
        margin: 7mm auto 0;
        width: 118mm;
        border: 0.4mm solid var(--line);
        border-radius: 3mm;
        overflow: hidden;
        background: var(--sand);
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 3mm 4mm;
        font-size: 8pt;
        line-height: 1.5;
        color: var(--muted);
        border-top: 0.4mm solid var(--line);
      }
      .note {
        margin-top: auto;
        padding-top: 6mm;
        font-size: 8.5pt;
        line-height: 1.6;
        color: var(--muted);
      }
      .foot {
        margin-top: 5mm;
        border-top: 0.4mm solid var(--line);
        padding-top: 4mm;
        display: flex;
        justify-content: space-between;
        font-size: 7.5pt;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b7085;
      }
      body[dir="rtl"] .foot {
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const D = window.__PAGE5__ || {};
      document.body.setAttribute("dir", D.dir);
      document.body.setAttribute("lang", D.lang);
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      document.write(`
        <section class="page">
          <div class="top"><img src="${D.logoDataUrl}" alt="" /><span>${esc(D.title)}</span></div>
          <p class="eyebrow">${esc(D.eyebrow)}</p>
          <h1>${esc(D.title)}</h1>
          <div class="rule"></div>
          <p class="lede">${D.ledeHtml}</p>
          <div class="bar">
            <h2>${esc(D.connectsLabel)}</h2>
            <div class="chips">${D.roles.map((r) => `<span class="chip">${esc(r)}</span>`).join("")}</div>
            <p>${esc(D.platformNote)}</p>
          </div>
          <div class="cols">
            ${D.columns
              .map(
                (c) => `<div><h3>${esc(c.title)}</h3><p>${esc(c.intro)}</p>
                  <ul>${c.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`,
              )
              .join("")}
          </div>
          <figure>
            <img src="${D.photoDataUrl}" alt="" />
            <figcaption>${esc(D.caption)}</figcaption>
          </figure>
          <p class="note">${esc(D.note)}</p>
          <div class="foot"><span>${esc(D.footer)}</span><span>${esc(D.pageNo)}</span></div>
        </section>
      `);
    </script>
  </body>
</html>
